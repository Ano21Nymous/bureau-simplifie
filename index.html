<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Bureau Simplifié</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <section class="clock" aria-live="off">
          <div class="clock__time" id="clock-time">--:--</div>
          <div class="clock__date" id="clock-date">&nbsp;</div>
        </section>

        <section class="weather" id="weather" aria-live="polite">
          <div class="weather__icon" id="weather-icon">☁️</div>
          <div class="weather__body">
            <div class="weather__temp" id="weather-temp">--°</div>
            <div class="weather__place" id="weather-place">Chargement…</div>
          </div>
        </section>
      </header>

      <main class="grid" id="grid" aria-label="Mes raccourcis"></main>

      <nav class="dock" id="dock" aria-label="Menu principal"></nav>

      <div class="overlay" id="overlay" hidden></div>
      <div class="toast" id="toast" hidden></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
