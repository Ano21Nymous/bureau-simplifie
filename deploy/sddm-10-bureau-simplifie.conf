# Dépose par deploy/install-kiosk.sh dans /etc/sddm.conf.d/
# Connexion automatique de l'utilisateur, directement dans la session kiosque.
#
# Nom du fichier de session (sans .desktop), tel qu'installe dans
# /usr/share/wayland-sessions/ ou /usr/share/xsessions/.

[Autologin]
User=UTILISATEUR
Session=bureau-simplifie
# Relogin=false : si la session se termine, SDDM réaffiche l'écran de
# connexion au lieu de relancer le kiosque en boucle. C'est la porte de
# secours pour revenir à un bureau normal.
Relogin=false

[General]
# Pas de pave numerique a l'ouverture : inutile pour ce bureau.
Numlock=off
