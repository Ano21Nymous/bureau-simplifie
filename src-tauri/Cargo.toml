[package]
name = "bureau-simplifie"
version = "0.1.0"
description = "Bureau simplifié et verrouillable pour un usage familial"
authors = ["Vous"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Nom utilisé par main.rs ; évite un conflit entre le binaire et la bibliothèque.
name = "bureau_simplifie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Binaire le plus petit possible en production.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
incremental = false
